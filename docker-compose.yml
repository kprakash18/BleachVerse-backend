services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bleachverse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bleachverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bleachverse}
      POSTGRES_DB: ${POSTGRES_DB:-bleachverse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bleachverse} -d ${POSTGRES_DB:-bleachverse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    container_name: bleachverse-api
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bleachverse}:${POSTGRES_PASSWORD:-bleachverse}@postgres:5432/${POSTGRES_DB:-bleachverse}
      DIRECT_URL: postgresql://${POSTGRES_USER:-bleachverse}:${POSTGRES_PASSWORD:-bleachverse}@postgres:5432/${POSTGRES_DB:-bleachverse}
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379
      REQUIRE_NEO4J: "false"
    ports:
      - "${API_HOST_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  setup:
    build:
      context: .
      target: tools
    profiles: ["setup"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bleachverse}:${POSTGRES_PASSWORD:-bleachverse}@postgres:5432/${POSTGRES_DB:-bleachverse}
      DIRECT_URL: postgresql://${POSTGRES_USER:-bleachverse}:${POSTGRES_PASSWORD:-bleachverse}@postgres:5432/${POSTGRES_DB:-bleachverse}
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "npx prisma migrate deploy &&
      npx prisma db seed &&
      node scripts/index-semantic-data.js &&
      node scripts/sync-neo4j.js"

  neo4j:
    image: neo4j:5.26.0-community
    container_name: bleachverse-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/bleachverse_secret_password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bleachverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
